<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>.site-header {
    --page-bg: linear-gradient(180deg, #f3f6fb 0%, #eef3f8 100%);
    background: transparent;
    padding-bottom: 0.5rem;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem;
}
.container .brand, .container .top-nav { z-index: 2 }

/* Import web font */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
html, body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; color:#0f2540; background: linear-gradient(180deg,#f3f7fb 0%, #eef3f8 100%); }

/* Page container */
.page-wrap { padding: 2rem 0 }
.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 0;
}
.brand { display:flex; align-items:center; gap:0.85rem; }
.brand .logo { font-size:2rem; }
.brand .title h1 { margin:0; font-size:1.25rem; color:#102a43; }
.brand .title .subtitle { margin:0; font-size:0.9rem; color:#345; opacity:0.85 }
.top-nav a { margin-left:1rem; color:#1d4e89; text-decoration:none; font-weight:600 }
.hero-visual { margin-top:0.6rem }
.hero-card { background: linear-gradient(90deg,#ffffff 0%, #f7fbff 100%); padding:1.6rem; border-radius:14px; box-shadow:0 18px 40px rgba(16,42,67,0.08); border:1px solid rgba(29,78,137,0.06) }
.hero-card h2 { margin:0 0 0.5rem 0; color:#071735; font-weight:700 }
.hero-card .muted { margin:0; color:#4b6b86; font-size:0.95rem }

/* Dashboard header metrics */
.metrics-row { display:flex; gap:1rem; margin-top:1rem }
.metric-card { padding: 1.1rem 1.3rem; border-radius: 12px; background: linear-gradient(180deg,#ffffff,#fbfdff); border: 1px solid rgba(16, 42, 67, 0.06); box-shadow: 0 10px 30px rgba(16, 42, 67, 0.05); }
.metric-card strong { color:#102a43; display:block }
.metric-value { font-size:1.25rem; font-weight:700; color:#0f2540; margin-top:0.35rem }

.block-container { padding-top: 1.5rem; padding-bottom: 2rem; }
.metric-card { padding: 1rem 1.1rem; border-radius: 12px; background: white; border: 1px solid rgba(16, 42, 67, 0.06); box-shadow: 0 6px 18px rgba(16, 42, 67, 0.04); }

.stButton>button { background: linear-gradient(90deg,#1d4e89 0%, #2a6fb7 100%); color: white; border: none; padding: 0.6rem 1rem; border-radius: 8px; box-shadow: 0 6px 18px rgba(29,78,137,0.18); }
.stDataFrame table { border-collapse: collapse; }
.metric-card strong { display: block; color: #102a43; font-size: 0.95rem; }

/* Footer */
.site-footer { margin-top:2rem; padding:1rem 0; font-size:0.9rem; color:#334; }
.site-footer .footer-inner { display:flex; justify-content:space-between; align-items:center; }

/* Make charts and images stand out */
.stPlotlyChart, .stImage, .stGraphviz { border-radius:10px; box-shadow:0 14px 40px rgba(16,42,67,0.06); background:linear-gradient(180deg,#fff,#fbfdff); padding:0.6rem }

/* Responsive tweaks */
@media (max-width: 800px) {
  .header-inner { flex-direction:column; align-items:flex-start }
  .top-nav { margin-top:0.6rem }
}

/* Small UI details */
.muted { color: #657786 }
.links { color:#1d4e89 }

</style>
